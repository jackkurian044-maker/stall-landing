name: Validate Digital Score Logo
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact logo asset
        run: |
          test -s stall-logo-exact.webp
          grep -q 'data:image/webp;base64,' stall-digital-score.html
