name: Fix Digital Score Logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inline-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore approved Digital Score page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, base64, urllib.request
          url="https://api.github.com/repos/${{ github.repository }}/contents/stall-digital-score.html?ref=74bcf33d46cd5c33ec14dbea52846d5e648b7cc3"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+__import__("os").environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req) as r:
              obj=json.load(r)
          data=obj.get("content","").replace("\\n","")
          if not data: raise SystemExit("Could not retrieve approved Digital Score source")
          open("stall-digital-score.html","wb").write(base64.b64decode(data))
          PY
      - name: Fetch exact STall product logo
        run: |
          curl -fsSL "https://raw.githubusercontent.com/jackkurian044-maker/Stall-App/de741a91ac5b7723eabc634b3ac0a0a1220f4a8b/src/stall-logo.png" -o stall-logo.png
          test -s stall-logo.png
      - name: Inline supplied STall logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          logo=Path('stall-logo.png')
          page=Path('stall-digital-score.html')
          if not logo.exists():
              raise SystemExit('stall-logo.png is missing')
          data='data:image/png;base64,'+base64.b64encode(logo.read_bytes()).decode('ascii')
          s=page.read_text(encoding='utf-8')
          s=re.sub(r'<img([^>]*?)src="(?:\\./)?(?:/)?stall-logo\.(?:webp|png)(?:\?[^"]*)?"([^>]*)>',
                   lambda m:'<img'+m.group(1)+'src="'+data+'"'+m.group(2)+'>', s)
          page.write_text(s,encoding='utf-8')
          PY
      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stall-digital-score.html
          git diff --cached --quiet || git commit -m "Fix Digital Score supplied logo rendering"
          git push
