name: Fix STall top logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-top-logo:
    if: github.actor == 'jackkurian044-maker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exact family horizontal logo
        shell: bash
        run: |
          mkdir -p .tmp-logo
          echo '' | base64 -d > stall-nav-horizontal.webp

      - name: Patch only top navigation logo
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("stall-digital-score.html")
          s = p.read_text(encoding="utf-8")

          s2 = re.sub(
              r'<a class="logo" href="#"><img src="data:image/svg\+xml,[\s\S]*?" alt="STall — That’s All" class="logoImg"></a>',
              '<a class="logo" href="#"><img src="/stall-nav-horizontal.webp" alt="STall — That’s All" class="logoImg"></a>',
              s,
              count=1,
          )
          s2 = s2.replace(
              '.logoImg{width:142px;height:68px;object-fit:contain;background:#fff;border-radius:0}',
              '.logoImg{width:120px;height:82px;object-fit:contain;background:#050505;border-radius:0;padding:0}'
          )
          s2 = s2.replace(
              '@media(max-width:700px){.logoImg{width:122px;height:60px}',
              '@media(max-width:700px){.logoImg{width:108px;height:72px}'
          )

          if s2 == s:
              raise SystemExit("No top-logo change was made; refusing to commit.")
          p.write_text(s2, encoding="utf-8")

      - name: Commit exact logo fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "jackkurian044-maker"
          git config user.email "jackkurian044@gmail.com"
          git add stall-digital-score.html stall-nav-horizontal.webp
          git rm .github/workflows/fix-top-logo.yml
          git commit -m "Fix top navigation logo with exact STall family asset"
          git push
