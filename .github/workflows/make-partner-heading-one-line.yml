name: Make partner heading one line
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update partner heading styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('business-growth.html')
          s = p.read_text(encoding='utf-8')
          old = '.wide-cta h2{margin:0 0 8px}'
          new = '.wide-cta h2{margin:0 0 8px;font-size:clamp(24px,3.2vw,38px);white-space:nowrap}'
          if old not in s:
              raise SystemExit('Partner heading CSS marker not found')
          s = s.replace(old, new, 1)
          marker = '@media(max-width:560px){'
          mobile = '@media(max-width:560px){.wide-cta h2{white-space:normal}'
          if mobile not in s:
              s = s.replace(marker, mobile, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-growth.html
          git commit -m "Keep partner heading on one line"
          rm -f .github/workflows/make-partner-heading-one-line.yml
          git add .github/workflows/make-partner-heading-one-line.yml
          git commit -m "Remove one-time partner heading workflow"
          git push
