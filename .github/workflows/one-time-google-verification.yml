name: One-time Google verification tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-google-verification.yml'

permissions:
  contents: write

jobs:
  add-verification-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Google verification tag only if missing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('business-growth.html')
          text = p.read_text(encoding='utf-8')
          tag = '<meta name="google-site-verification" content="euKGuANErcx_mfU_l59CDgWSXtEhzaT8qYJa5o26KpA" />'
          if tag not in text:
              marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
              if marker not in text:
                  raise SystemExit('Expected viewport meta tag not found; no changes made.')
              text = text.replace(marker, marker + '\n' + tag, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit the one-line verification change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-growth.html
          if git diff --cached --quiet; then
            echo "Verification tag already present; nothing to commit."
            exit 0
          fi
          git commit -m "Add Google Search Console verification tag to live page"
          git push
