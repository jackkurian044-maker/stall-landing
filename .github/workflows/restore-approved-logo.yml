name: Restore approved STall logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore logo references only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('business-growth.html')
          s = p.read_text()
          s2 = s.replace('stall-logo-family.svg', 'logo-cropped.png')
          if s2 == s:
              print('No logo-family reference found; nothing to change.')
          else:
              p.write_text(s2)
              print('Restored business-growth.html logo references to logo-cropped.png')
          PY
      - name: Commit logo-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add business-growth.html
          git diff --cached --quiet || git commit -m 'Restore approved STall logo only'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/restore-approved-logo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Remove one-time logo restore workflow'
          git push
