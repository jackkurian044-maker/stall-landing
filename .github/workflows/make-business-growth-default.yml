name: Make business growth the default page

on:
  push:
    paths:
      - '.github/workflows/make-business-growth-default.yml'

permissions:
  contents: write

jobs:
  update-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redirect root to business growth page
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<meta name="stall-default-page" content="business-growth">'
          if marker not in s:
              s = s.replace('<head>', '<head>\n' + marker + '\n<meta http-equiv="refresh" content="0;url=/business-growth.html">\n<script>window.location.replace("/business-growth.html" + window.location.search + window.location.hash);</script>', 1)
              p.write_text(s)
          PY
          grep -n "stall-default-page\|business-growth.html" index.html | head

      - name: Remove one-time workflow and commit
        run: |
          set -e
          rm -f .github/workflows/make-business-growth-default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/make-business-growth-default.yml
          git diff --cached --stat
          git commit -m "Make business growth page the default"
          git push
